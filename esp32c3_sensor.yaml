esphome:
  name: esp32c3-radar-lux
  friendly_name: "ESP32-C3 Presence & Lux Sensor"

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

logger:
api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# I2C Bus for VEML7700
i2c:
  sda: GPIO8
  scl: GPIO9
  scan: true

# UART Bus for LD2450
uart:
  - id: uart_ld2450
    tx_pin: GPIO6
    rx_pin: GPIO7
    baud_rate: 256000

# Radar Core Component
ld2450:
  id: my_ld2450
  uart_id: uart_ld2450

# Sensors
sensor:
  - platform: veml7700
    address: 0x10
    ambient_light:
      name: "Room Illuminance"
    update_interval: 10s

  - platform: ld2450
    ld2450_id: my_ld2450
    target_1:
      x:
        name: "Target 1 X Position"
      y:
        name: "Target 1 Y Position"
      speed:
        name: "Target 1 Speed"
      distance:
        name: "Target 1 Distance"

# Detection Flags
binary_sensor:
  - platform: ld2450
    ld2450_id: my_ld2450
    has_target:
      name: "Presence Detected"
    has_moving_target:
      name: "Moving Target Detected"
    has_still_target:
      name: "Still Target Detected"